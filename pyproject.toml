[project]
name = "medusa"
version = "0.1.0"
description = "An agentic feedback loop that generates digital twins"
readme = "README.md"
authors = [
    { name = "Joshua Lorincz", email = "joshlordeveloper@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
    "matplotlib>=3.8",
    "openai>=1.40",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
medusa = "medusa.cli:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
